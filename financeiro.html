<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Financeiro - Gold Style</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:25px;
}

header h1{
    color:#ffd700;
    font-size:32px;
    text-shadow:0 0 15px #ffd700;
}

header p{
    color:#aaa;
    margin-top:6px;
}

.cards{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#111;
    border:1px solid #333;
    border-radius:16px;
    padding:20px;
}

.card h3{
    color:#aaa;
    font-size:14px;
    margin-bottom:10px;
}

.card strong{
    font-size:25px;
    color:#ffd700;
}

.recebido{
    border-color:#168a3d;
}

.recebido strong{
    color:#39e66f;
}

.pendente{
    border-color:#b89000;
}

.pendente strong{
    color:#ffd700;
}

.previsao{
    border-color:#006b8f;
}

.previsao strong{
    color:#4fd8ff;
}

.pix{
    border-color:#7b42f6;
}

.pix strong{
    color:#b48cff;
}

.painel{
    background:#101010;
    border:1px solid #333;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.painel h2{
    color:#ffd700;
    margin-bottom:15px;
}

.filtros{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

input,
select{
    background:#181818;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:12px;
    font-size:15px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-filtrar{
    background:#ffd700;
    color:#000;
}

.btn-voltar{
    background:#222;
    color:white;
    border:1px solid #555;
    margin-bottom:20px;
}

.btn-pago{
    background:#16a34a;
    color:white;
    padding:8px 10px;
    font-size:12px;
}

.btn-pago:hover{
    background:#20c45a;
}

.tabela{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#1c1c1c;
    color:#ffd700;
    padding:12px;
    text-align:left;
    font-size:13px;
}

td{
    padding:12px;
    border-bottom:1px solid #292929;
    font-size:13px;
}

tr:hover{
    background:#151515;
}

.status{
    display:inline-block;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
}

.status-pendente{
    background:#3a3000;
    color:#ffd700;
}

.status-pago{
    background:#0d3a1b;
    color:#48ef79;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#777;
}

.carregando{
    text-align:center;
    padding:30px;
    color:#ffd700;
}

.mensagem{
    display:none;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.sucesso{
    display:block;
    background:#0d3518;
    border:1px solid #25c65a;
    color:#7aff9b;
}

.erro{
    display:block;
    background:#351010;
    border:1px solid #ff4444;
    color:#ff9999;
}

@media(max-width:600px){

    body{
        padding:12px;
    }

    header h1{
        font-size:26px;
    }

    .card strong{
        font-size:21px;
    }

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>💰 GOLD STYLE</h1>

<p>Financeiro da Barbearia</p>

</header>


<button
class="btn-voltar"
onclick="window.location.href='admin.html'">

← Voltar para o painel

</button>


<div id="mensagem"
class="mensagem">
</div>


<div class="cards">

<div class="card recebido">

<h3>Total recebido</h3>

<strong id="totalRecebido">
R$ 0,00
</strong>

</div>


<div class="card pendente">

<h3>Total pendente</h3>

<strong id="totalPendente">
R$ 0,00
</strong>

</div>


<div class="card previsao">

<h3>Total previsto</h3>

<strong id="totalPrevisto">
R$ 0,00
</strong>

</div>


<div class="card pix">

<h3>Pagamentos Pix</h3>

<strong id="totalPix">
0
</strong>

</div>

</div>


<div class="painel">

<h2>🔎 Filtros</h2>

<div class="filtros">

<input
type="date"
id="dataInicial">

<input
type="date"
id="dataFinal">

<select id="filtroStatus">

<option value="">
Todos os status
</option>

<option value="Pendente">
Pendentes
</option>

<option value="Pago">
Pagos
</option>

</select>

<button
class="btn-filtrar"
onclick="carregarFinanceiro()">

Filtrar

</button>

</div>

</div>


<div class="painel">

<h2>💳 Pagamentos</h2>

<div class="tabela">

<table>

<thead>

<tr>

<th>Cliente</th>

<th>Serviço</th>

<th>Data</th>

<th>Horário</th>

<th>Valor</th>

<th>Método</th>

<th>Status</th>

<th>Referência</th>

<th>Ação</th>

</tr>

</thead>

<tbody id="tabelaPagamentos">

<tr>

<td
colspan="9"
class="carregando">

Carregando pagamentos...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ivvswiprdqgroeoelqmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function dinheiro(valor){

    return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


function formatarData(data){

    if(!data){
        return "---";
    }

    const partes =
        data.split("-");

    if(partes.length !== 3){
        return data;
    }

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


function mostrarMensagem(texto,tipo){

    const elemento =
        document.getElementById("mensagem");

    elemento.className =
        "mensagem " + tipo;

    elemento.innerHTML =
        texto;

    elemento.style.display =
        "block";

}


function esconderMensagem(){

    const elemento =
        document.getElementById("mensagem");

    elemento.style.display =
        "none";

}


async function verificarAdmin(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient
        .auth
        .getSession();


    if(!session){

        window.location.href =
            "login.html";

        return false;

    }


    const {
        data:admin,
        error
    } =
        await supabaseClient

        .from("administradores")

        .select("id")

        .eq(
            "auth_user_id",
            session.user.id
        )

        .eq(
            "ativo",
            true
        )

        .maybeSingle();


    if(error || !admin){

        alert(
            "Acesso permitido somente para administradores."
        );

        window.location.href =
            "cliente.html";

        return false;

    }


    return true;

}


async function carregarFinanceiro(){

    esconderMensagem();


    const tabela =
        document.getElementById(
            "tabelaPagamentos"
        );


    tabela.innerHTML = `
        <tr>
            <td colspan="9"
            class="carregando">
            Carregando pagamentos...
            </td>
        </tr>
    `;


    let query =
        supabaseClient

        .from("pagamentos")

        .select(`
            id,
            agendamento_id,
            cliente_id,
            valor,
            metodo,
            status,
            referencia,
            criado_em
        `)

        .order(
            "criado_em",
            {
                ascending:false
            }
        );


    const dataInicial =
        document.getElementById(
            "dataInicial"
        ).value;


    const dataFinal =
        document.getElementById(
            "dataFinal"
        ).value;


    const filtroStatus =
        document.getElementById(
            "filtroStatus"
        ).value;


    if(dataInicial){

        query =
            query.gte(
                "criado_em",
                dataInicial +
                "T00:00:00"
            );

    }


    if(dataFinal){

        query =
            query.lte(
                "criado_em",
                dataFinal +
                "T23:59:59"
            );

    }


    if(filtroStatus){

        query =
            query.eq(
                "status",
                filtroStatus
            );

    }


    const {
        data:pagamentos,
        error
    } =
        await query;


    if(error){

        console.error(error);

        tabela.innerHTML = `
            <tr>
                <td colspan="9"
                class="vazio">
                Erro ao carregar pagamentos.
                <br><br>
                ${error.message}
                </td>
            </tr>
        `;

        mostrarMensagem(
            "Erro ao carregar o financeiro: " +
            error.message,
            "erro"
        );

        return;

    }


    if(!pagamentos ||
       pagamentos.length === 0){

        tabela.innerHTML = `
            <tr>
                <td colspan="9"
                class="vazio">
                Nenhum pagamento encontrado.
                </td>
            </tr>
        `;

        atualizarCards([]);

        return;

    }


    const idsAgendamento =
        pagamentos
        .map(p => p.agendamento_id)
        .filter(Boolean);


    let agendamentos = [];


    if(idsAgendamento.length > 0){

        const resultado =
            await supabaseClient

            .from("agendamentos")

            .select(`
                id,
                "Serviços",
                "Data",
                "Horário"
            `)

            .in(
                "id",
                idsAgendamento
            );


        if(!resultado.error){

            agendamentos =
                resultado.data || [];

        }

    }


    const idsClientes =
        pagamentos
        .map(p => p.cliente_id)
        .filter(Boolean);


    let clientes = [];


    if(idsClientes.length > 0){

        const resultado =
            await supabaseClient

            .from("clientes")

            .select(`
                id,
                Nome
            `)

            .in(
                "id",
                idsClientes
            );


        if(!resultado.error){

            clientes =
                resultado.data || [];

        }

    }


    tabela.innerHTML = "";


    pagamentos.forEach(
        pagamento => {

        const agendamento =
            agendamentos.find(
                a =>
                a.id ===
                pagamento.agendamento_id
            );


        const cliente =
            clientes.find(
                c =>
                c.id ===
                pagamento.cliente_id
            );


        const status =
            pagamento.status ||
            "Pendente";


        const statusClasse =
            status === "Pago"
            ? "status-pago"
            : "status-pendente";


        let botao = "";


        if(status !== "Pago"){

            botao = `
                <button
                class="btn-pago"
                onclick="marcarComoPago('${pagamento.id}')">

                ✓ Marcar como pago

                </button>
            `;

        }else{

            botao = `
                <span
                class="status status-pago">

                ✓ Confirmado

                </span>
            `;

        }


        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                ${
                    cliente?.Nome ||
                    "Cliente"
                }
            </td>

            <td>
                ${
                    agendamento?.["Serviços"] ||
                    "---"
                }
            </td>

            <td>
                ${
                    formatarData(
                        agendamento?.["Data"]
                    )
                }
            </td>

            <td>
                ${
                    agendamento?.["Horário"]
                    ? agendamento["Horário"]
                        .substring(0,5)
                    : "---"
                }
            </td>

            <td>
                <strong>
                ${
                    dinheiro(
                        pagamento.valor
                    )
                }
                </strong>
            </td>

            <td>
                ${
                    pagamento.metodo ||
                    "---"
                }
            </td>

            <td>

                <span
                class="status ${statusClasse}">

                ${status}

                </span>

            </td>

            <td>
                ${
                    pagamento.referencia ||
                    "---"
                }
            </td>

            <td>

                ${botao}

            </td>

        `;


        tabela.appendChild(tr);

    });


    atualizarCards(pagamentos);

}


function atualizarCards(pagamentos){

    let recebido = 0;

    let pendente = 0;

    let pix = 0;


    pagamentos.forEach(
        pagamento => {

        const valor =
            Number(
                pagamento.valor || 0
            );


        if(
            pagamento.status ===
            "Pago"
        ){

            recebido += valor;

        }else{

            pendente += valor;

        }


        if(
            String(
                pagamento.metodo || ""
            ).toLowerCase()
            === "pix"
        ){

            pix++;

        }

    });


    const previsto =
        recebido +
        pendente;


    document.getElementById(
        "totalRecebido"
    ).textContent =
        dinheiro(recebido);


    document.getElementById(
        "totalPendente"
    ).textContent =
        dinheiro(pendente);


    document.getElementById(
        "totalPrevisto"
    ).textContent =
        dinheiro(previsto);


    document.getElementById(
        "totalPix"
    ).textContent =
        pix;

}


/*
==================================================
NOVO SISTEMA DE CONFIRMAÇÃO DE PAGAMENTO
==================================================
*/

async function marcarComoPago(id){

    esconderMensagem();


    const confirmar =
        confirm(
            "Confirmar que este pagamento Pix foi recebido?"
        );


    if(!confirmar){

        return;

    }


    /*
    1. BUSCAR O PAGAMENTO PRIMEIRO
    */

    const {
        data:pagamento,
        error:errorBusca
    } =
        await supabaseClient

        .from("pagamentos")

        .select(`
            id,
            agendamento_id,
            cliente_id,
            valor,
            metodo,
            status,
            referencia
        `)

        .eq(
            "id",
            id
        )

        .maybeSingle();


    if(errorBusca){

        console.error(
            errorBusca
        );

        mostrarMensagem(
            "Não foi possível localizar o pagamento: " +
            errorBusca.message,
            "erro"
        );

        return;

    }


    if(!pagamento){

        mostrarMensagem(
            "Pagamento não encontrado.",
            "erro"
        );

        return;

    }


    /*
    2. CONFERIR O AGENDAMENTO
    */

    const agendamentoId =
        pagamento.agendamento_id;


    if(!agendamentoId){

        mostrarMensagem(
            "Este pagamento não possui um agendamento vinculado.",
            "erro"
        );

        return;

    }


    /*
    3. ATUALIZAR PAGAMENTO
    */

    const {
        error:errorPagamento
    } =
        await supabaseClient

        .from("pagamentos")

        .update({

            status:
                "Pago",

            atualizado_em:
                new Date().toISOString()

        })

        .eq(
            "id",
            id
        );


    if(errorPagamento){

        console.error(
            errorPagamento
        );

        mostrarMensagem(
            "Não foi possível atualizar o pagamento: " +
            errorPagamento.message,
            "erro"
        );

        return;

    }


    /*
    4. ATUALIZAR AGENDAMENTO
    */

    const {
        error:errorAgendamento
    } =
        await supabaseClient

        .from("agendamentos")

        .update({

            "Pagamento":
                "Pago",

            "Status":
                "Confirmado"

        })

        .eq(
            "id",
            agendamentoId
        );


    if(errorAgendamento){

        console.error(
            errorAgendamento
        );

        mostrarMensagem(
            "O pagamento foi marcado como Pago, " +
            "mas houve um erro ao atualizar o agendamento:<br><br>" +
            errorAgendamento.message,
            "erro"
        );

        await carregarFinanceiro();

        return;

    }


    /*
    5. SUCESSO
    */

    mostrarMensagem(
        "Pagamento confirmado com sucesso! 💰<br><br>" +
        "O pagamento agora está como <strong>Pago</strong> " +
        "e o agendamento foi atualizado.",
        "sucesso"
    );


    await carregarFinanceiro();

}


async function iniciar(){

    const autorizado =
        await verificarAdmin();


    if(!autorizado){

        return;

    }


    await carregarFinanceiro();

}


iniciar();

</script>

</body>

    </html>
