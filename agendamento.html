</a></div></div><script>

const SUPABASE_URL =
"https://ivvswiprdqgroeoelqmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   CHAVE PIX DA BARBEARIA
========================= */

const CHAVE_PIX =
"5bed6193-1b51-46d2-a03e-6f3993acd719";


/* =========================
   LINKS TON PERMANENTES
========================= */

const LINKS_TON = {

10:
"https://payment-link-v3.ton.com.br/pl_oq2970jvGORAJgqSQDC31WezNQrpYyBb",

25:
"https://payment-link-v3.ton.com.br/pl_1PDWnL34RNV0eEh5lTjK0KGEr5jZ8OJk",

30:
"https://payment-link-v3.ton.com.br/pl_mGaP2635LkgZBxuvRtQd1wvq0JrNX4od",

50:
"https://payment-link-v3.ton.com.br/pl_aqEexl9bokzYgG5TjFBWmGL23Pw5j0nX",

70:
"https://payment-link-v3.ton.com.br/pl_9aEDMZXAy4KnNr0HxxcXJwLWbmOproke",

80:
"https://payment-link-v3.ton.com.br/pl_pbM30vjLYQqwlqZtp7snW6aPe4o2KGdx",

120:
"https://payment-link-v3.ton.com.br/pl_GnByNYokmL03nwQHNECo7bj6gJ4DQEqa"

};


/* =========================
   HORÁRIOS
========================= */

const horarios = [

"08:00",
"09:00",
"10:00",
"11:00",
"12:00",
"13:00",
"14:00",
"15:00",
"16:00",
"17:00",
"18:00"

];


const horariosDomingo = [

"08:00",
"09:00",
"10:00",
"11:00"

];


let usuarioAtual = null;

let clienteAtual = null;

let agendamentoCriadoId = null;

let linkTonAtual = null;

let valorTonAtual = 0;


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(
texto,
tipo
){

const elemento =
document.getElementById(
"mensagem"
);

elemento.textContent =
texto;

elemento.className =
"mensagem "+tipo;

elemento.style.display =
"block";

}


function limparMensagem(){

const elemento =
document.getElementById(
"mensagem"
);

elemento.style.display =
"none";

}


/* =========================
   LOGIN
========================= */

async function verificarUsuario(){

const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();


if(!session){

window.location.href =
"login.html";

return false;

}


usuarioAtual =
session.user;


const {
data:cliente,
error
} =
await supabaseClient
.from("clientes")
.select(
"id,Nome,Telefone,\"E-mail\""
)
.eq(
"auth_user_id",
session.user.id
)
.maybeSingle();


if(error){

console.error(error);

mostrarMensagem(
"Erro ao carregar seus dados.",
"erro"
);

return false;

}


if(!cliente){

mostrarMensagem(
"Seu cadastro de cliente não foi encontrado.",
"erro"
);

return false;

}


clienteAtual =
cliente;


document.getElementById(
"nome"
).value =
cliente.Nome || "";


document.getElementById(
"telefone"
).value =
cliente.Telefone || "";


return true;

}


/* =========================
   SERVIÇOS
========================= */

async function carregarServicos(){

const select =
document.getElementById(
"servico"
);


const {
data,
error
} =
await supabaseClient
.from("Serviços")
.select("*")
.eq("Ativo",true)
.order(
"created_at",
{ascending:true}
);


if(error){

console.error(error);

mostrarMensagem(
"Erro ao carregar os serviços.",
"erro"
);

return;

}


data.forEach(
servico=>{

const option =
document.createElement(
"option"
);

option.value =
servico.id;

option.textContent =
`${servico.created_at} - R$ ${
Number(
servico.Valor || 0
).toFixed(2).replace(".",",")
}`;

option.dataset.nome =
servico.created_at;

option.dataset.valor =
servico.Valor;

select.appendChild(
option
);

}
);

}


/* =========================
   HORÁRIOS
========================= */

async function carregarHorarios(){

const data =
document.getElementById(
"data"
).value;


const horarioSelect =
document.getElementById(
"horario"
);


const info =
document.getElementById(
"infoHorario"
);


horarioSelect.innerHTML = `

<option value="">
Selecione um horário
</option>

`;

document.getElementById(
"btnAgendar"
).disabled = true;


if(!data){

info.textContent =
"Escolha uma data para visualizar os horários disponíveis.";

return;

}


const dataEscolhida =
new Date(
data+"T00:00:00"
);


const diaSemana =
dataEscolhida.getDay();


let horariosDoDia;


if(diaSemana===0){

horariosDoDia =
horariosDomingo;

}else{

horariosDoDia =
horarios;

}


/* BUSCAR OCUPADOS */

const {
data:agendamentos,
error
} =
await supabaseClient
.from("agendamentos")
.select("Horário,Status")
.eq(
"Data",
data
);


if(error){

console.error(error);

info.textContent =
"Não foi possível carregar os horários.";

mostrarMensagem(
"Erro ao verificar horários disponíveis.",
"erro"
);

return;

}


const horariosOcupados =
(agendamentos || [])
.filter(
agendamento =>
agendamento.Status !==
"Cancelado"
)
.map(
agendamento =>
String(
agendamento.Horário
).substring(0,5)
);


let quantidadeDisponivel =
0;


horariosDoDia.forEach(
horario=>{

if(
horariosOcupados.includes(
horario
)
){

return;

}


const option =
document.createElement(
"option"
);

option.value =
horario;

option.textContent =
horario+" - Disponível";

horarioSelect.appendChild(
option
);

quantidadeDisponivel++;

}
);


if(
quantidadeDisponivel===0
){

info.textContent =
"Não há horários disponíveis nesta data.";

return;

}


info.textContent =
quantidadeDisponivel+
" horário(s) disponível(is).";


horarioSelect.onchange =
function(){

document.getElementById(
"btnAgendar"
).disabled =
!this.value;

};

}


/* =========================
   CRIAR AGENDAMENTO
========================= */

async function criarAgendamento(){

limparMensagem();


const servicoSelect =
document.getElementById(
"servico"
);


const data =
document.getElementById(
"data"
).value;


const horario =
document.getElementById(
"horario"
).value;


if(
!servicoSelect.value ||
!data ||
!horario
){

mostrarMensagem(
"Preencha serviço, data e horário.",
"erro"
);

return;

}


const option =
servicoSelect.options[
servicoSelect.selectedIndex
];


const nomeServico =
option.dataset.nome;


const valor =
Number(
option.dataset.valor || 0
);


const botao =
document.getElementById(
"btnAgendar"
);


botao.disabled =
true;

botao.textContent =
"VERIFICANDO...";


/* SEGUNDA VERIFICAÇÃO */

const {
data:ocupado,
error:erroBusca
} =
await supabaseClient
.from("agendamentos")
.select("id,Status")
.eq(
"Data",
data
)
.eq(
"Horário",
horario
)
.maybeSingle();


if(erroBusca){

console.error(erroBusca);

mostrarMensagem(
"Não foi possível verificar o horário.",
"erro"
);

botao.disabled =
false;

botao.textContent =
"CONFIRMAR AGENDAMENTO";

return;

}


if(
ocupado &&
ocupado.Status !==
"Cancelado"
){

mostrarMensagem(
"Esse horário acabou de ser reservado. Escolha outro horário.",
"erro"
);

await carregarHorarios();

botao.disabled =
true;

botao.textContent =
"CONFIRMAR AGENDAMENTO";

return;

}


/* SALVAR */

botao.textContent =
"SALVANDO...";


const {
data:agendamentoCriado,
error
} =
await supabaseClient
.from("agendamentos")
.insert({

Cliente_id:
clienteAtual.id,

Serviços:
nomeServico,

Valor:
valor,

Data:
data,

Horário:
horario,

Status:
"Pendente",

Pagamento:
"Pendente",

Serviço_id:
servicoSelect.value,

auth_user_id:
usuarioAtual.id

})
.select("id")
.single();


if(error){

console.error(error);

mostrarMensagem(
"Não foi possível criar o agendamento: "+
error.message,
"erro"
);

botao.disabled =
false;

botao.textContent =
"CONFIRMAR AGENDAMENTO";

return;

}


/* AGENDAMENTO CRIADO */

mostrarMensagem(
"Agendamento realizado com sucesso!",
"sucesso"
);


botao.textContent =
"AGENDAMENTO REALIZADO";


agendamentoCriadoId =
agendamentoCriado?.id || null;


valorTonAtual =
valor;


linkTonAtual =
LINKS_TON[
Number(valor)
];


const boxTon =
document.getElementById(
"pagamentoTon"
);


const valorTon =
document.getElementById(
"valorTon"
);


const btnTon =
document.getElementById(
"btnPagarTon"
);


valorTon.textContent =
"R$ "+
valor.toFixed(2)
.replace(".",",");


boxTon.style.display =
"block";


if(linkTonAtual){

btnTon.disabled =
false;

btnTon.textContent =
"PAGAR AGORA COM TON";


/*
  Não abrimos automaticamente.
  O cliente escolhe Ton ou Pix.
*/

}else{

btnTon.disabled =
true;

btnTon.textContent =
"LINK TON NÃO CADASTRADO";

}


await carregarHorarios();

}


/* =========================
   PAGAR COM TON
========================= */

async function pagarComTon(){

if(!linkTonAtual){

mostrarMensagem(
"Não existe link Ton cadastrado para este valor.",
"erro"
);

return;

}


if(
agendamentoCriadoId &&
clienteAtual?.id
){

const {
error
} =
await supabaseClient
.from("pagamentos")
.insert({

agendamento_id:
agendamentoCriadoId,

cliente_id:
clienteAtual.id,

valor:
valorTonAtual,

metodo:
"Ton",

status:
"Pendente",

referencia:
"Link Ton permanente - "+
valorTonAtual.toFixed(2)

});


if(error){

console.error(
"Erro ao registrar pagamento Ton:",
error
);

}

}


window.open(
linkTonAtual,
"_blank",
"noopener,noreferrer"
);

}


/* =========================
   COPIAR PIX
========================= */

async function copiarPix(){

const botao =
document.getElementById(
"btnCopiarPix"
);


try{

await navigator.clipboard.writeText(
CHAVE_PIX
);


botao.textContent =
"✅ CHAVE PIX COPIADA!";


botao.classList.add(
"btn-pix-copiado"
);


setTimeout(
function(){

botao.textContent =
"📋 COPIAR CHAVE PIX";

botao.classList.remove(
"btn-pix-copiado"
);

},
2500
);


mostrarMensagem(
"Chave Pix copiada. Agora é só colar no aplicativo do seu banco.",
"sucesso"
);


}
catch(error){

console.error(error);


mostrarMensagem(
"Não foi possível copiar automaticamente. Segure a chave Pix e copie manualmente.",
"erro"
);

}

}


/* =========================
   DATA
========================= */

document.getElementById(
"data"
).addEventListener(
"change",
async function(){

limparMensagem();

await carregarHorarios();

}
);


/* =========================
   INICIALIZAÇÃO
========================= */

(async()=>{

const autorizado =
await verificarUsuario();


if(!autorizado){

return;

}


await carregarServicos();


/* DATA MÍNIMA = HOJE */

const hoje =
new Date();


const ano =
hoje.getFullYear();


const mes =
String(
hoje.getMonth()+1
).padStart(2,"0");


const dia =
String(
hoje.getDate()
).padStart(2,"0");


document.getElementById(
"data"
).min =
`${ano}-${mes}-${dia}`;

})();

</script></body></html>
