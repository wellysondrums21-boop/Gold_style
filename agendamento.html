<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agendamento | Gold Style</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">GOLD STYLE</div>
  <div class="subtitle">AGENDAMENTO</div>
</header>

<main>

  <section class="hero">
    <h1>Agende seu horário</h1>

    <p>
      Escolha o serviço, a data e o horário
      que deseja ser atendido.
    </p>
  </section>

  <form>

    <label for="nome">Nome completo</label>
    <input
      type="text"
      id="nome"
      name="nome"
      placeholder="Digite seu nome"
      required>

    <label for="telefone">WhatsApp</label>
    <input
      type="tel"
      id="telefone"
      name="telefone"
      placeholder="(68) 99985-3643"
      required>

    <label for="servico">Escolha o serviço</label>

    <select id="servico" name="servico" required>
      <option value="">Selecione um serviço</option>
      <option>Corte Social — R$ 25</option>
      <option>Degradê / Navalhado — R$ 30</option>
      <option>Corte + Barba — R$ 50</option>
      <option>Sobrancelha — R$ 10</option>
      <option>Barba — R$ 25</option>
      <option>Selagem — R$ 65</option>
      <option>Luzes — R$ 80</option>
      <option>Platinado — a partir de R$ 120</option>
    </select>

    <label for="data">Escolha a data</label>

    <input
      type="date"
      id="data"
      name="data"
      required>

    <label for="horario">Escolha o horário</label>

    <select id="horario" name="horario" required>
      <option value="">Selecione um horário</option>
      <option>08:00</option>
      <option>09:00</option>
      <option>10:00</option>
      <option>11:00</option>
      <option>12:00</option>
      <option>13:00</option>
      <option>14:00</option>
      <option>15:00</option>
      <option>16:00</option>
      <option>17:00</option>
      <option>18:00</option>
    </select>

    <button type="submit" class="btn btn-gold">
      CONTINUAR AGENDAMENTO
    </button>

  </form>

  <a href="index.html" class="btn btn-dark">
    VOLTAR PARA INÍCIO
  </a>

</main>

<footer>
  <strong>Gold Style Barbearia</strong><br>
  Rio Branco - Acre<br>
  Segunda a sábado: 08h às 19h<br>
  Domingo: 08h às 12h
</footer>

</body>
</html>
