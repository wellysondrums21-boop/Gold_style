.pago {

.info-box {
    background: #181818;

}

.info-box span {

    color: #888;
    font-size: 12px;

.info-box strong {

.produtos h3 {

.produto {

.produto:last-child {

.total {

    margin: 15px 0;

.acoes {

    flex-wrap: wrap;

}

.btn-pagar {
    background: #0c5;
    color: #fff;
    border: none;
}

.btn-processar {
    background: #ffd700;
    color: #000;
    border: none;
}

.btn-cancelar {
    background: #8b1111;
    color: #fff;
    border: none;
}

.mensagem {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

.erro {
    color: #ff5555;
    background: #210808;

    padding: 15px;
    border-radius: 10px;

    display: none;

.sucesso {

    display: none;
}

@media (max-width: 600px) {

    .container {
        width: 92%;
    }

    }

    .acoes .btn {
        width: 100%;
        text-align: center;
    }

    .logo {
        font-size: 23px;
    }
}
</style>
</head>
