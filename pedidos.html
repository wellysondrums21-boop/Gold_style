<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pedidos | Gold Style</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#050505,#171717);
    border-bottom:2px solid #d4af37;
    padding:20px;
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 12px rgba(255,215,0,.5);
}

.subtitulo{
    color:#aaa;
    margin-top:5px;
    font-size:14px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.topo h1{
    color:#ffd700;
}

.btn{
    border:1px solid #ffd700;
    background:#111;
    color:#ffd700;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    font-weight:bold;
}

.btn:hover{
    background:#ffd700;
    color:#000;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:20px;
}

.card h3{
    color:#aaa;
    font-size:14px;
    margin-bottom:10px;
}

.card strong{
    color:#ffd700;
    font-size:25px;
}

.pedido{
    background:#101010;
    border:1px solid #333;
    border-left:4px solid #ffd700;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
}

.pedido-topo{
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.numero{
    color:#ffd700;
    font-weight:bold;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.pendente{
    background:#3b3000;
    color:#ffd700;
}

.pago{
    background:#063b1d;
    color:#4cff88;
}

.cancelado{
    background:#3b0909;
    color:#ff6b6b;
}

.info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-bottom:18px;
}

.info-box{
    background:#181818;
    border-radius:10px;
    padding:12px;
}

.info-box span{
    display:block;
    color:#888;
    font-size:12px;
    margin-bottom:5px;
}

.info-box strong{
    color:#fff;
}

.produtos{
    background:#080808;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.produtos h3{
    color:#ffd700;
    margin-bottom:10px;
}

.produto{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #222;
}

.produto:last-child{
    border-bottom:none;
}

.total{
    font-size:22px;
    color:#ffd700;
    font-weight:bold;
    margin:15px 0;
}

/* TON */

.ton-box{
    background:linear-gradient(
        135deg,
        #111,
        #1c1600
    );

    border:1px solid #d4af37;
    border-radius:14px;
    padding:16px;
    margin:15px 0;
}

.ton-titulo{
    color:#ffd700;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.ton-label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin:10px 0 6px;
}

.ton-input{
    width:100%;
    background:#050505;
    border:1px solid #444;
    border-radius:9px;
    padding:12px;
    color:#fff;
    outline:none;
}

.ton-input:focus{
    border-color:#ffd700;
    box-shadow:0 0 8px rgba(255,215,0,.2);
}

.ton-botoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

.btn-ton{
    background:#ffd700;
    color:#000;
    border:none;
}

.btn-abrir{
    background:#0a8f45;
    color:#fff;
    border:none;
}

.btn-copiar{
    background:#222;
    color:#ffd700;
}

.link-salvo{
    margin-top:10px;
    font-size:12px;
    color:#4cff88;
    word-break:break-all;
}

.acoes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.btn-pagar{
    background:#0a8f45;
    color:#fff;
    border:none;
}

.btn-processar{
    background:#ffd700;
    color:#000;
    border:none;
}

.btn-concluir{
    background:#1687a8;
    color:#fff;
    border:none;
}

.btn-cancelar{
    background:#8b1111;
    color:#fff;
    border:none;
}

.mensagem{
    text-align:center;
    padding:30px;
    color:#aaa;
}

.erro,
.sucesso{
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    display:none;
}

.erro{
    color:#ff7777;
    background:#210808;
    border:1px solid #7b1c1c;
}

.sucesso{
    color:#4cff88;
    background:#062112;
    border:1px solid #1c7b42;
}

@media(max-width:600px){

    .container{
        width:92%;
    }

    .produto{
        flex-direction:column;
    }

    .acoes .btn,
    .ton-botoes .btn{
        width:100%;
        text-align:center;
    }

    .logo{
        font-size:23px;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">

</div>

<div class="subtitulo">
Painel administrativo • Pedidos de produtos
</div>

</header>

<div class="container">

<div class="topo">

<h1>

</h1>

<div>

<a
href="admin.html"

>

>

0
</strong>

<div class="card">

<h3>

</h3>

<strong id="aguardandoPagamento">

</strong>

</h3>

<strong id="pedidosPagos">

Valor dos pedidos

</div>

<script>

const SUPABASE_URL =
"https://ivvswiprdqgroeoelqmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   FUNÇÕES BÁSICAS
========================= */

function dinheiro(valor){

return Number(
valor || 0
).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


function escapeHtml(valor){

return String(
valor ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function formatarData(data){

if(!data)
return "-";

return new Date(
data
).toLocaleString(
"pt-BR"
);

}


function mostrarErro(mensagem){

const erro =
document.getElementById(
"erro"
);

erro.textContent =
mensagem;

erro.style.display =
"block";

document.getElementById(
"sucesso"
).style.display =
"none";

}


function mostrarSucesso(mensagem){

const sucesso =
document.getElementById(
"sucesso"
);

sucesso.textContent =
mensagem;

sucesso.style.display =
"block";

document.getElementById(
"erro"
).style.display =
"none";

setTimeout(
()=>{
sucesso.style.display =
"none";
},
4000
);

}


/* =========================
   ADMIN
========================= */

async function verificarAdministrador(){

const {
data:{
session
}
} =
await supabaseClient.auth.getSession();

if(!session){

window.location.href =
"login.html";

return false;

}

const {
data,
error
} =
await supabaseClient
.from("administradores")
.select("id")
.eq(
"auth_user_id",
session.user.id
)
.eq(
"ativo",
true
)
.maybeSingle();

if(error){

mostrarErro(
"Erro ao verificar administrador: "
+
error.message
);

return false;

}

if(!data){

document.body.innerHTML = `

<div style="
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#050505;
color:#ffd700;
text-align:center;
padding:30px;
font-family:Arial;
">

<div>

<h1>
Acesso negado
</h1>

<p style="
color:#aaa;
margin-top:10px;
">

Esta área é exclusiva
do administrador.

</p>

<a
href="cliente.html"
style="
display:inline-block;
margin-top:20px;
padding:12px 18px;
background:#ffd700;
color:#000;
border-radius:10px;
text-decoration:none;
font-weight:bold;
"
>

Voltar

</a>

</div>

</div>

`;

return false;

}

return true;

}


/* =========================
   SALVAR LINK TON
========================= */

async function salvarTon(
id
){

const linkInput =
document.getElementById(
"ton-link-" + id
);

const referenciaInput =
document.getElementById(
"ton-ref-" + id
);

if(!linkInput){

mostrarErro(
"Campo do link Ton não encontrado."
);

return;

}

const link =
linkInput.value.trim();

const referencia =
referenciaInput
?
referenciaInput.value.trim()
:
"";


if(
link &&
!(
link.startsWith("http://")
||
link.startsWith("https://")
)
){

mostrarErro(
"O link Ton precisa começar com https://"
);

return;

}


const botao =
document.getElementById(
"btn-ton-" + id
);

if(botao){

botao.disabled =
true;

botao.textContent =
"Salvando...";

}


const {
error
} =
await supabaseClient
.from("pedidos_produtos")
.update({

link_pagamento_ton:
link || null,

referencia_pagamento_ton:
referencia || null,

atualizado_em:
new Date()
.toISOString()

})
.eq(
"id",
id
);


if(botao){

botao.disabled =
false;

botao.textContent =
"💾 Salvar Ton";

}


if(error){

mostrarErro(
"Não foi possível salvar o pagamento Ton: "
+
error.message
);

return;

}


mostrarSucesso(
"Link de pagamento Ton salvo com sucesso."
);

await carregarPedidos();

}


/* =========================
   ABRIR TON
========================= */

function abrirTon(
link
){

if(!link){

mostrarErro(
"Este pedido ainda não possui link de pagamento Ton."
);

return;

}

window.open(
link,
"_blank"
);

}


/* =========================
   COPIAR LINK TON
========================= */

async function copiarTon(
id
){

const input =
document.getElementById(
"ton-link-" + id
);

if(!input){

mostrarErro(
"Link Ton não encontrado."
);

return;

}

const link =
input.value.trim();

if(!link){

mostrarErro(
"Digite ou cole um link Ton primeiro."
);

return;

}

try{

await navigator.clipboard.writeText(
link
);

mostrarSucesso(
"Link Ton copiado."
);

}catch(error){

input.select();

document.execCommand(
"copy"
);

mostrarSucesso(
"Link Ton copiado."
);

}

}


/* =========================
   CARREGAR PEDIDOS
========================= */

async function carregarPedidos(){

document.getElementById(
"listaPedidos"
).innerHTML = `

<div class="mensagem">
Carregando pedidos...
</div>

`;

try{

const {
data:pedidos,
error
} =
await supabaseClient
.from("pedidos_produtos")
.select("*")
.order(
"criado_em",
{
ascending:false
}
);

if(error){

throw new Error(
"Pedidos: "
+
error.message
);

}


const idsClientes =
[
...new Set(
(pedidos || [])
.map(
p =>
p.cliente_id
)
.filter(Boolean)
)
];


const idsPedidos =
(pedidos || [])
.map(
p =>
p.id
);


let clientes = [];

let itens = [];


if(
idsClientes.length
){

const resultadoClientes =
await supabaseClient
.from("clientes")
.select(
'id,"Nome","Telefone","E-mail"'
)
.in(
"id",
idsClientes
);

if(
resultadoClientes.error
){

throw new Error(
"Clientes: "
+
resultadoClientes.error.message
);

}

clientes =
resultadoClientes.data ||
[];

}


if(
idsPedidos.length
){

const resultadoItens =
await supabaseClient
.from("itens_pedido")
.select("*")
.in(
"pedido_id",
idsPedidos
);

if(
resultadoItens.error
){

throw new Error(
"Itens dos pedidos: "
+
resultadoItens.error.message
);

}

itens =
resultadoItens.data ||
[];

}


const clienteMap = {};


clientes.forEach(
cliente => {

clienteMap[
cliente.id
] =
cliente;

}
);


const itensMap = {};


itens.forEach(
item => {

if(
!itensMap[
item.pedido_id
]
){

itensMap[
item.pedido_id
] =
[];

}

itensMap[
item.pedido_id
].push(
item
);

}
);


atualizarResumo(
pedidos || []
);


if(
!pedidos ||
!pedidos.length
){

document.getElementById(
"listaPedidos"
).innerHTML = `

<div class="mensagem">

📦 Nenhum pedido encontrado.

</div>

`;

return;

}


let html = "";


pedidos.forEach(
(pedido,index) => {


const cliente =
clienteMap[
pedido.cliente_id
] ||
{};


const itensPedido =
itensMap[
pedido.id
] ||
[];


const pagamento =
pedido.status_pagamento ||
"Pendente";


const statusPedido =
pedido.status_pedido ||
"Aguardando pagamento";


let classe =
"pendente";


if(
pagamento.toLowerCase()
===
"pago"
){

classe =
"pago";

}


if(
pagamento.toLowerCase()
===
"cancelado"
){

classe =
"cancelado";

}


/* =========================
   PRODUTOS
========================= */

let produtosHtml = "";


if(
itensPedido.length
){

produtosHtml =
itensPedido
.map(
item => `

<div class="produto">

<div>

<strong>

${escapeHtml(
item.produto_nome
)}

</strong>

<div style="
color:#888;
font-size:13px;
margin-top:4px;
">

Quantidade:
${Number(
item.quantidade ||
0
)}

</div>

</div>

<div>

${dinheiro(
item.valor_total
)}

</div>

</div>

`
)
.join("");

}else{

produtosHtml = `

<p style="color:#888">

Nenhum item encontrado.

</p>

`;

}


/* =========================
   AÇÕES
========================= */

let acoes = "";


if(
pagamento !== "Pago"
&&
pagamento !== "Cancelado"
){

acoes += `

<button
class="btn btn-pagar"
onclick="marcarPago('${pedido.id}')"
>

💰 Confirmar pagamento

</button>

`;

}


if(
pagamento === "Pago"
&&
statusPedido !== "Processando"
&&
statusPedido !== "Concluído"
){

acoes += `

<button
class="btn btn-processar"
onclick="processarPedido('${pedido.id}')"
>

📦 Processar pedido

</button>

`;

}


if(
statusPedido === "Processando"
){

acoes += `

<button
class="btn btn-concluir"
onclick="concluirPedido('${pedido.id}')"
>

✅ Concluir pedido

</button>

`;

}


if(
statusPedido !== "Cancelado"
&&
statusPedido !== "Concluído"
){

acoes += `

<button
class="btn btn-cancelar"
onclick="cancelarPedido('${pedido.id}')"
>

❌ Cancelar

</button>

`;

}


/* =========================
   TON
========================= */

const tonLink =
pedido.link_pagamento_ton ||
"";


const tonReferencia =
pedido.referencia_pagamento_ton ||
"";


let tonLinkSalvo = "";


if(tonLink){

tonLinkSalvo = `

<div class="link-salvo">

✅ Link Ton cadastrado:
${escapeHtml(
tonLink
)}

</div>

`;

}


html += `

<div class="pedido">

<div class="pedido-topo">

<div>

<div class="numero">

PEDIDO #${index + 1}

</div>

<div style="
color:#777;
font-size:12px;
margin-top:5px;
">

ID:
${escapeHtml(
pedido.id
)}

</div>

</div>

<div class="
status
${classe}
">

Pagamento:
${escapeHtml(
pagamento
)}

</div>

</div>


<div class="info">


<div class="info-box">

<span>
Cliente
</span>

<strong>

${escapeHtml(
cliente.Nome ||
"Cliente"
)}

</strong>

</div>


<div class="info-box">

<span>
WhatsApp
</span>

<strong>

${escapeHtml(
cliente.Telefone ||
"-"
)}

</strong>

</div>


<div class="info-box">

<span>
E-mail
</span>

<strong>

${escapeHtml(
cliente["E-mail"] ||
"-"
)}

</strong>

</div>


<div class="info-box">

<span>
Pagamento
</span>

<strong>

${escapeHtml(
pedido.metodo_pagamento ||
"-"
)}

</strong>

</div>


<div class="info-box">

<span>
Status do pedido
</span>

<strong>

${escapeHtml(
statusPedido
)}

</strong>

</div>


<div class="info-box">

<span>
Data
</span>

<strong>

${formatarData(
pedido.criado_em
)}

</strong>

</div>


</div>


<div class="produtos">

<h3>
🛒 Produtos
</h3>

${produtosHtml}

</div>


<div class="total">

Total:
${dinheiro(
pedido.total
)}

</div>


<!-- =====================
     PAGAMENTO TON
===================== -->

<div class="ton-box">

<div class="ton-titulo">
💳 Pagamento pelo Ton
</div>


<label class="ton-label">
Link de pagamento Ton
</label>

<input
type="url"
class="ton-input"
id="ton-link-${pedido.id}"
value="${escapeHtml(tonLink)}"
placeholder="https://payment-link-v3.ton.com.br/..."
>


<label class="ton-label">
Referência da cobrança
</label>

<input
type="text"
class="ton-input"
id="ton-ref-${pedido.id}"
value="${escapeHtml(tonReferencia)}"
placeholder="Ex.: Pedido Gold Style #123"
>


<div class="ton-botoes">

<button
id="btn-ton-${pedido.id}"
class="btn btn-ton"
onclick="salvarTon('${pedido.id}')"
>

💾 Salvar Ton

</button>


${
tonLink
?
`

<button
class="btn btn-abrir"
onclick="abrirTon('${escapeHtml(tonLink)}')"
>

🔗 Abrir pagamento

</button>

`
:
""
}


<button
class="btn btn-copiar"
onclick="copiarTon('${pedido.id}')"
>

📋 Copiar link

</button>

</div>


${tonLinkSalvo}

</div>


<div class="acoes">

${acoes}

</div>


</div>

`;

}
);


document.getElementById(
"listaPedidos"
).innerHTML =
html;


}catch(error){

console.error(error);


document.getElementById(
"listaPedidos"
).innerHTML = `

<div class="mensagem">

Não foi possível carregar
os pedidos.

</div>

`;


mostrarErro(
error.message ||
"Erro desconhecido."
);

}

}


/* =========================
   RESUMO
========================= */

function atualizarResumo(
pedidos
){

document.getElementById(
"totalPedidos"
).textContent =
pedidos.length;


document.getElementById(
"aguardandoPagamento"
).textContent =
pedidos.filter(
p =>
p.status_pagamento !==
"Pago"
&&
p.status_pagamento !==
"Cancelado"
).length;


document.getElementById(
"pedidosPagos"
).textContent =
pedidos.filter(
p =>
p.status_pagamento ===
"Pago"
).length;


document.getElementById(
"valorTotal"
).textContent =
dinheiro(
pedidos.reduce(
(
total,
pedido
) =>
total +
Number(
pedido.total ||
0
),
0
)
);

}


/* =========================
   ATUALIZAR PEDIDO
========================= */

async function atualizarPedido(
id,
dados,
mensagem
){

const {
error
} =
await supabaseClient
.from(
"pedidos_produtos"
)
.update({

...dados,

atualizado_em:
new Date()
.toISOString()

})
.eq(
"id",
id
);


if(error){

mostrarErro(
error.message
);

return false;

}


mostrarSucesso(
mensagem
);


await carregarPedidos();


return true;

}


/* =========================
   CONFIRMAR PAGAMENTO
========================= */

async function marcarPago(
id
){

if(
!confirm(
"Confirmar que este pedido foi pago no Ton?"
)
)
return;


await atualizarPedido(
id,
{
status_pagamento:
"Pago",

status_pedido:
"Aguardando processamento"
},
"Pagamento confirmado com sucesso."
);

}


/* =========================
   PROCESSAR
========================= */

async function processarPedido(
id
){

if(
!confirm(
"Marcar este pedido como processando?"
)
)
return;


await atualizarPedido(
id,
{
status_pedido:
"Processando"
},
"Pedido marcado como processando."
);

}


/* =========================
   CONCLUIR
========================= */

async function concluirPedido(
id
){

if(
!confirm(
"Concluir este pedido e dar baixa no estoque?"
)
)
return;


try{

const {
data,
error
} =
await supabaseClient
.rpc(
"finalizar_pedido_produto",
{
p_pedido_id:id
}
);


if(error){

throw error;

}


if(
data &&
data.sucesso === false
){

throw new Error(
data.mensagem ||
"Não foi possível concluir o pedido."
);

}


mostrarSucesso(
(data && data.mensagem) ||
"Pedido concluído e estoque atualizado."
);


await carregarPedidos();


}catch(error){

console.error(error);


mostrarErro(
"Não foi possível concluir o pedido: "
+
(
error.message ||
"Erro desconhecido."
)
);

}

}


/* =========================
   CANCELAR
========================= */

async function cancelarPedido(
id
){

if(
!confirm(
"Tem certeza que deseja cancelar este pedido?"
)
)
return;


await atualizarPedido(
id,
{
status_pedido:
"Cancelado",

status_pagamento:
"Cancelado"
},
"Pedido cancelado."
);

}


/* =========================
   INICIAR
========================= */

async function iniciar(){

const autorizado =
await verificarAdministrador();


if(
autorizado
){

await carregarPedidos();

}

}


iniciar();

</script>
