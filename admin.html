<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gold Style - Painel Administrativo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
}

header{
    background:linear-gradient(135deg,#050505,#151515);
    border-bottom:2px solid #ffd700;
    padding:22px 15px;
    text-align:center;
}

.logo{
    color:#ffd700;
    font-size:30px;
    font-weight:bold;
}

.slogan{
    color:#aaa;
    margin-top:5px;
}

.container{
    width:94%;
    max-width:1200px;
    margin:25px auto;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:25px;
}

.menu a{
    background:#111;
    border:1px solid #333;
    color:white;
    text-decoration:none;
    padding:15px 10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    transition:.2s;
}

.menu a:hover{
    border-color:#ffd700;
    color:#ffd700;
    transform:translateY(-2px);
}

.menu .sair{
    color:#ff5555;
}

h1{
    color:#ffd700;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:15px;
    margin:20px 0;
}

.card{
    background:#111;
    border:1px solid #333;
    border-left:4px solid #ffd700;
    border-radius:12px;
    padding:20px;
}

.card strong{
    display:block;
    color:#aaa;
    margin-bottom:8px;
}

.numero{
    color:#ffd700;
    font-size:28px;
    font-weight:bold;
}

.section{
    background:#111;
    border:1px solid #333;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    overflow-x:auto;
}

.section h2{
    color:#ffd700;
    margin-top:0;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    color:#ffd700;
    text-align:left;
    padding:12px;
    border-bottom:1px solid #444;
}

td{
    padding:12px;
    border-bottom:1px solid #222;
}

select{
    background:#050505;
    color:white;
    border:1px solid #555;
    padding:8px;
    border-radius:6px;
}

button{
    background:#ffd700;
    color:#000;
    border:0;
    padding:9px 12px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.mensagem{
    text-align:center;
    color:#aaa;
    padding:20px;
}

.erro{
    color:#ff5555;
}

@media(max-width:600px){

    .container{
        width:92%;
    }

    .logo{
        font-size:25px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        GOLD STYLE
    </div>

    <div class="slogan">
        BARBEARIA DESDE 2022
    </div>

</header>


<div class="container">

    <div class="menu">

        <a href="admin.html">
            🏠 Dashboard
        </a>

        <a href="agenda-admin.html">
            📅 Agenda
        </a>

        <a href="servicos.html">
            ✂️ Serviços
        </a>

        <a href="clientes.html">
            👥 Clientes
        </a>

        <a href="produtos.html">
            🛍️ Produtos
        </a>

        <a href="financeiro.html">
            💰 Financeiro
        </a>

        <a href="relatorios.html">
            📊 Relatórios
        </a>

        <a href="configuracoes.html">
            ⚙️ Configurações
        </a>

        <a href="#" class="sair" onclick="sair()">
            🚪 Sair
        </a>

    </div>


    <h1>📊 Dashboard</h1>


    <div class="cards">

        <div class="card">
            <strong>Agendamentos</strong>
            <div class="numero" id="totalAgendamentos">
                0
            </div>
        </div>

        <div class="card">
            <strong>Clientes</strong>
            <div class="numero" id="totalClientes">
                0
            </div>
        </div>

        <div class="card">
            <strong>Faturamento</strong>
            <div class="numero" id="faturamento">
                R$ 0,00
            </div>
        </div>

        <div class="card">
            <strong>Pendentes</strong>
            <div class="numero" id="pendentes">
                0
            </div>
        </div>

    </div>


    <div class="section">

        <h2>📅 Próximos agendamentos</h2>

        <div id="listaAgendamentos">
            <div class="mensagem">
                Carregando...
            </div>
        </div>

    </div>


    <div class="section">

        <h2>👥 Clientes cadastrados</h2>

        <div id="listaClientes">
            <div class="mensagem">
                Carregando...
            </div>
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://ivvswiprdqgroeoelqmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// VERIFICAR ADMIN
async function verificarAdmin(){

    const {
        data:{
            session
        }
    } = await supabaseClient.auth.getSession();

    if(!session){

        window.location.href="login.html";

        return false;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("administradores")
        .select("id")
        .eq("auth_user_id",session.user.id)
        .eq("ativo",true)
        .maybeSingle();


    if(error || !data){

        alert("Acesso administrativo não autorizado.");

        window.location.href="cliente.html";

        return false;
    }

    return true;
}


// CARREGAR DASHBOARD
async function carregarDashboard(){

    const {
        data:agendamentos,
        error:erroAgendamentos
    } = await supabaseClient
        .from("agendamentos")
        .select("*")
        .order("Data",{ascending:true})
        .order("Horário",{ascending:true});


    if(erroAgendamentos){

        console.error(erroAgendamentos);

    }


    const {
        data:clientes,
        error:erroClientes
    } = await supabaseClient
        .from("clientes")
        .select("*");


    if(erroClientes){

        console.error(erroClientes);

    }


    const listaAgendamentos =
        agendamentos || [];

    const listaClientes =
        clientes || [];


    document.getElementById(
        "totalAgendamentos"
    ).textContent =
        listaAgendamentos.length;


    document.getElementById(
        "totalClientes"
    ).textContent =
        listaClientes.length;


    const pendentes =
        listaAgendamentos.filter(
            a=>a.Status==="Pendente"
        ).length;


    document.getElementById(
        "pendentes"
    ).textContent =
        pendentes;


    const faturamento =
        listaAgendamentos
        .filter(
            a=>a.Status!=="Cancelado"
        )
        .reduce(
            (total,a)=>
                total + Number(a.Valor || 0),
            0
        );


    document.getElementById(
        "faturamento"
    ).textContent =
        "R$ "+
        faturamento
        .toFixed(2)
        .replace(".",",");


    mostrarAgendamentos(
        listaAgendamentos
    );


    mostrarClientes(
        listaClientes
    );

}


// MOSTRAR AGENDAMENTOS
function mostrarAgendamentos(lista){

    const elemento =
        document.getElementById(
            "listaAgendamentos"
        );


    if(!lista.length){

        elemento.innerHTML =
            '<div class="mensagem">Nenhum agendamento encontrado.</div>';

        return;
    }


    let html=`

        <table>

            <thead>

                <tr>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Pagamento</th>
                </tr>

            </thead>

            <tbody>

    `;


    lista.slice(0,20).forEach(
        agendamento=>{

            const data =
                agendamento.Data
                ? new Date(
                    agendamento.Data+"T00:00:00"
                  ).toLocaleDateString("pt-BR")
                : "-";


            const horario =
                agendamento.Horário
                ? String(
                    agendamento.Horário
                  ).substring(0,5)
                : "-";


            html += `

                <tr>

                    <td>
                        ${agendamento["Serviços"] || "-"}
                    </td>

                    <td>
                        ${data}
                    </td>

                    <td>
                        ${horario}
                    </td>

                    <td>
                        R$ ${
                            Number(
                                agendamento.Valor || 0
                            )
                            .toFixed(2)
                            .replace(".",",")
                        }
                    </td>

                    <td>
                        ${agendamento.Status || "-"}
                    </td>

                    <td>
                        ${agendamento.Pagamento || "-"}
                    </td>

                </tr>

            `;

        }
    );


    html +=`

            </tbody>

        </table>

    `;


    elemento.innerHTML=html;

}


// MOSTRAR CLIENTES
function mostrarClientes(lista){

    const elemento =
        document.getElementById(
            "listaClientes"
        );


    if(!lista.length){

        elemento.innerHTML =
            '<div class="mensagem">Nenhum cliente cadastrado.</div>';

        return;
    }


    let html=`

        <table>

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                </tr>

            </thead>

            <tbody>

    `;


    lista.slice(0,20).forEach(
        cliente=>{

            html +=`

                <tr>

                    <td>
                        ${cliente.Nome || "-"}
                    </td>

                    <td>
                        ${cliente.Telefone || "-"}
                    </td>

                    <td>
                        ${cliente["E-mail"] || "-"}
                    </td>

                </tr>

            `;

        }
    );


    html +=`

            </tbody>

        </table>

    `;


    elemento.innerHTML=html;

}


// SAIR
async function sair(){

    await supabaseClient.auth.signOut();

    window.location.href="login.html";

}


// INICIAR
(async()=>{

    const autorizado =
        await verificarAdmin();

    if(autorizado){

        await carregarDashboard();

    }

})();

</script>

</body>
   </html>
