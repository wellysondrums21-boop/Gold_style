<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Gold Style</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">GOLD STYLE</div>
  <div class="subtitle">CRIAR CONTA</div>
</header>

<main>

  <section class="hero">
    <h1>Crie sua conta</h1>
    <p>Cadastre seus dados para facilitar seus próximos agendamentos.</p>
  </section>

  <form id="cadastroForm">

    <label for="nome">Nome completo</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome completo"
      required
    >

    <label for="telefone">WhatsApp</label>
    <input
      type="tel"
      id="telefone"
      placeholder="(68) 99985-3643"
      required
    >

    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      placeholder="seuemail@email.com"
      required
    >

    <label for="senha">Criar senha</label>
    <input
      type="password"
      id="senha"
      placeholder="Crie uma senha"
      minlength="6"
      required
    >

    <label for="confirmar">Confirmar senha</label>
    <input
      type="password"
      id="confirmar"
      placeholder="Digite a senha novamente"
      minlength="6"
      required
    >

    <button type="submit" class="btn btn-gold">
      CRIAR MINHA CONTA
    </button>

  </form>

  <div id="mensagem"></div>

  <a href="index.html" class="btn btn-dark">
    VOLTAR PARA INÍCIO
  </a>

</main>

<footer>
  <strong>Gold Style Barbearia</strong><br>
  Rio Branco - Acre<br>
  Barbearia desde 2022
</footer>


<script>

const SUPABASE_URL = "https://ivvswiprdqgroeoelqmh.supabase.co";

const SUPABASE_KEY = "sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


document
  .getElementById("cadastroForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar").value;

    const mensagem = document.getElementById("mensagem");

    if (senha !== confirmar) {

      mensagem.innerHTML =
        "<p style='color:#ff4444;text-align:center;margin:15px 0;'>As senhas não são iguais.</p>";

      return;
    }

    mensagem.innerHTML =
      "<p style='color:#ffd700;text-align:center;margin:15px 0;'>Criando sua conta...</p>";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: senha
        });


      if (error) {
        throw error;
      }


      if (!data.user) {
        throw new Error("Não foi possível criar o usuário.");
      }


      const { error: clienteError } =
        await supabaseClient
          .from("clientes")
          .insert([{
            nome: nome,
            telefone: telefone,
            email: email,
            auth_user_id: data.user.id
          }]);


      if (clienteError) {
        throw clienteError;
      }


      mensagem.innerHTML =
        "<p style='color:#ffd700;text-align:center;margin:15px 0;'>Conta criada com sucesso! Verifique seu e-mail para confirmar o cadastro.</p>";


      document.getElementById("cadastroForm").reset();

    } catch (error) {

      console.error(error);

      mensagem.innerHTML =
        "<p style='color:#ff4444;text-align:center;margin:15px 0;'>Erro: "
        + error.message +
        "</p>";

    }

  });

</script>

</body>
</html>
