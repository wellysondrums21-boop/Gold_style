<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Gold Style</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">GOLD STYLE</div>
  <div class="subtitle">ÁREA DO CLIENTE</div>
</header>

<main>

  <section class="hero">

    <h1>Bem-vindo!</h1>

    <p>
      Entre na sua conta para acessar
      seus agendamentos.
    </p>

  </section>

  <form>

    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="Digite seu e-mail"
      required>

    <label for="senha">
      Senha
    </label>

    <input
      type="password"
      id="senha"
      name="senha"
      placeholder="Digite sua senha"
      required>

    <button
      type="submit"
      class="btn btn-gold">
      ENTRAR
    </button>

  </form>

  <a
    href="cadastro.html"
    class="btn btn-dark">
    CRIAR MINHA CONTA
  </a>

  <a
    href="index.html"
    class="btn btn-dark">
    VOLTAR PARA INÍCIO
  </a>

</main>

<footer>

  <strong>Gold Style Barbearia</strong><br>

  Rio Branco - Acre<br>

  Barbearia desde 2022

</footer>

</body>
</html>
