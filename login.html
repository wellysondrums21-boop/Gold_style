<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Gold Style Barbearia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at top,
          rgba(255, 215, 0, 0.15),
          transparent 40%
        ),
        #050505;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #ffd700;

      font-size: 38px;

      font-weight: 900;

      letter-spacing: 4px;

      text-shadow:
        0 0 8px rgba(255, 215, 0, 0.7),
        0 0 22px rgba(255, 215, 0, 0.35);
    }

    .logo p {
      margin-top: 5px;

      font-size: 12px;

      letter-spacing: 3px;

      color: #ffffff;
    }

    .card {
      padding: 30px 22px;

      background:
        linear-gradient(
          145deg,
          #151515,
          #080808
        );

      border:
        1px solid rgba(255, 215, 0, 0.3);

      border-radius: 20px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.65);
    }

    .card h2 {
      text-align: center;

      color: #ffd700;

      margin-bottom: 8px;

      font-size: 25px;
    }

    .intro {
      text-align: center;

      color: #aaaaaa;

      font-size: 14px;

      margin-bottom: 25px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #ffd700;

      font-weight: bold;

      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 15px;

      margin-bottom: 18px;

      border-radius: 11px;

      border:
        1px solid rgba(255, 215, 0, 0.25);

      background: #050505;

      color: #ffffff;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: #ffd700;

      box-shadow:
        0 0 12px rgba(255, 215, 0, 0.2);
    }

    input::placeholder {
      color: #777777;
    }

    button,
    .link-button {
      width: 100%;

      display: block;

      padding: 15px;

      margin-top: 10px;

      border-radius: 11px;

      text-align: center;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      text-decoration: none;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover,
    .link-button:hover {
      transform: translateY(-2px);
    }

    .btn-login {
      border: none;

      color: #050505;

      background:
        linear-gradient(
          135deg,
          #fff2a6,
          #ffd700,
          #d4af37
        );

      box-shadow:
        0 0 15px rgba(255, 215, 0, 0.35);
    }

    .btn-login:hover {
      box-shadow:
        0 0 25px rgba(255, 215, 0, 0.65);
    }

    .btn-secondary {
      color: #ffd700;

      background: #101010;

      border:
        1px solid rgba(255, 215, 0, 0.4);
    }

    .forgot {
      display: block;

      margin-top: 16px;

      text-align: center;

      color: #ffd700;

      font-size: 14px;

      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .message {
      display: none;

      padding: 13px;

      margin-bottom: 18px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;
    }

    .error {
      color: #ffb0b0;

      background: #250909;

      border:
        1px solid #702222;
    }

    .success {
      color: #d8ffb0;

      background: #0c2109;

      border:
        1px solid #315f25;
    }

    .loading {
      opacity: 0.65;

      pointer-events: none;
    }

    footer {
      text-align: center;

      margin-top: 22px;

      color: #777777;

      font-size: 12px;

      line-height: 1.7;
    }

    footer strong {
      color: #ffd700;
    }

    @media (max-width: 500px) {

      .logo h1 {
        font-size: 31px;
      }

      .card {
        padding: 25px 18px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="logo">

    <h1>
      GOLD STYLE
    </h1>

    <p>
      BARBEARIA DESDE 2022
    </p>

  </div>


  <div class="card">

    <h2>
      Entrar
    </h2>

    <p class="intro">
      Acesse sua área exclusiva da Gold Style.
    </p>


    <div
      id="mensagemErro"
      class="message error"
    ></div>


    <div
      id="mensagemSucesso"
      class="message success"
    ></div>


    <form id="loginForm">


      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required
      >


      <label for="senha">
        Senha
      </label>

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >


      <button
        type="submit"
        id="btnLogin"
        class="btn-login"
      >
        ENTRAR
      </button>


    </form>


    <a
      href="#"
      id="esqueciSenha"
      class="forgot"
    >
      Esqueci minha senha
    </a>


    <a
      href="cadastro.html"
      class="link-button btn-secondary"
    >
      CRIAR MINHA CONTA
    </a>


    <a
      href="index.html"
      class="link-button btn-secondary"
    >
      VOLTAR PARA O INÍCIO
    </a>


  </div>


  <footer>

    <strong>
      Gold Style Barbearia
    </strong>

    <br>

    Rua Preciosa 557

    <br>

    Rio Branco - Acre

    <br>

    📱 (68) 99985-3643

  </footer>


</div>


<script>


const SUPABASE_URL =
"https://ivvswiprdqgroeoelqmh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const loginForm =
document.getElementById(
  "loginForm"
);


const emailInput =
document.getElementById(
  "email"
);


const senhaInput =
document.getElementById(
  "senha"
);


const btnLogin =
document.getElementById(
  "btnLogin"
);


const mensagemErro =
document.getElementById(
  "mensagemErro"
);


const mensagemSucesso =
document.getElementById(
  "mensagemSucesso"
);


function mostrarErro(
  mensagem
) {

  mensagemSucesso.style.display =
    "none";

  mensagemErro.textContent =
    mensagem;

  mensagemErro.style.display =
    "block";

}


function mostrarSucesso(
  mensagem
) {

  mensagemErro.style.display =
    "none";

  mensagemSucesso.textContent =
    mensagem;

  mensagemSucesso.style.display =
    "block";

}


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      emailInput.value.trim();

    const senha =
      senhaInput.value;


    if (!email || !senha) {

      mostrarErro(
        "Digite seu e-mail e sua senha."
      );

      return;

    }


    btnLogin.disabled =
      true;

    btnLogin.textContent =
      "ENTRANDO...";

    loginForm.classList.add(
      "loading"
    );


    try {

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: senha

        });


      if (error) {

        console.error(error);

        mostrarErro(
          "E-mail ou senha incorretos."
        );

        return;

      }


      if (!data.session) {

        mostrarErro(
          "Não foi possível iniciar sua sessão."
        );

        return;

      }


      mostrarSucesso(
        "Login realizado! Entrando..."
      );


      setTimeout(
        function() {

          window.location.href =
            "cliente.html";

        },
        700
      );


    } catch (error) {

      console.error(error);

      mostrarErro(
        "Ocorreu um erro ao tentar entrar."
      );

    } finally {

      btnLogin.disabled =
        false;

      btnLogin.textContent =
        "ENTRAR";

      loginForm.classList.remove(
        "loading"
      );

    }

  }
);


document
  .getElementById(
    "esqueciSenha"
  )
  .addEventListener(
    "click",
    async function(event) {

      event.preventDefault();


      const email =
        emailInput.value.trim();


      if (!email) {

        mostrarErro(
          "Digite seu e-mail primeiro para receber o link de recuperação."
        );

        emailInput.focus();

        return;

      }


      try {

        const {
          error
        } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://wellysondrums21-boop.github.io/Gold_style/login.html"
            }
          );


        if (error) {

          console.error(error);

          mostrarErro(
            "Não foi possível enviar o link de recuperação."
          );

          return;

        }


        mostrarSucesso(
          "Link de recuperação enviado para seu e-mail."
        );


      } catch (error) {

        console.error(error);

        mostrarErro(
          "Ocorreu um erro ao solicitar a recuperação."
        );

      }

    }
  );


</script>


</body>

  </html>
