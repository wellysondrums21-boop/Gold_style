<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Gold Style</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      color: #ffd700;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #ffd700;
    }

    button {
      border: none;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #mensagem {
      text-align: center;
      line-height: 1.5;
      margin: 18px 0;
    }

    .esqueci {
      display: block;
      text-align: center;
      color: #ffd700;
      margin: 15px 0;
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">GOLD STYLE</div>
  <div class="subtitle">ÁREA DO CLIENTE</div>
</header>

<main>

  <section class="hero">
    <h1>Bem-vindo!</h1>

    <p>
      Entre na sua conta para acessar
      seus agendamentos.
    </p>
  </section>

  <form id="loginForm">

    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      placeholder="Digite seu e-mail"
      autocomplete="email"
      required>

    <label for="senha">
      Senha
    </label>

    <input
      type="password"
      id="senha"
      placeholder="Digite sua senha"
      autocomplete="current-password"
      required>

    <button
      type="submit"
      class="btn btn-gold"
      id="botaoLogin">

      ENTRAR

    </button>

  </form>

  <div id="mensagem"></div>

  <a
    href="javascript:void(0)"
    class="esqueci"
    id="esqueciSenha">

    ESQUECI MINHA SENHA

  </a>

  <a
    href="cadastro.html"
    class="btn btn-dark">

    CRIAR MINHA CONTA

  </a>

  <a
    href="index.html"
    class="btn btn-dark">

    VOLTAR PARA INÍCIO

  </a>

</main>

<footer>

  <strong>Gold Style Barbearia</strong><br>

  Rio Branco - Acre<br>

  Barbearia desde 2022

</footer>

<script>

const SUPABASE_URL =
"https://ivvswiprdqgroeoelqmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a7B6AJ8dWV_ji8UNp0vxbg_mz3aKmtD";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form =
document.getElementById("loginForm");

const mensagem =
document.getElementById("mensagem");

const botao =
document.getElementById("botaoLogin");

const esqueciSenha =
document.getElementById("esqueciSenha");


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
    document.getElementById("email").value.trim();

    const senha =
    document.getElementById("senha").value;

    if (!email || !senha) {

      mensagem.innerHTML =
      "<span style='color:#ff4444;font-weight:bold'>" +
      "❌ Preencha o e-mail e a senha." +
      "</span>";

      return;
    }

    botao.disabled = true;

    botao.innerText =
    "ENTRANDO...";

    mensagem.innerHTML =
    "<span style='color:#ffd700'>" +
    "Verificando seus dados..." +
    "</span>";

    try {

      const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: senha

      });

      if (error) {
        throw error;
      }

      const {
        data: sessionCheck,
        error: sessionError
      } =
      await supabaseClient.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      if (
        !sessionCheck.session ||
        !data.user
      ) {

        throw new Error(
          "O login não criou uma sessão. Tente novamente."
        );

      }

      mensagem.innerHTML =
      "<span style='color:#ffd700;font-weight:bold'>" +

      "✅ LOGIN REALIZADO COM SUCESSO!<br><br>" +

      "Abrindo sua área de cliente..." +

      "</span>";

      setTimeout(function() {

        window.location.href =
        "cliente.html";

      }, 700);

    }

    catch (error) {

      console.error(
        "Erro no login:",
        error
      );

      let texto =
      error?.message ||
      "Não foi possível realizar o login.";

      const textoMinusculo =
      texto.toLowerCase();

      if (
        textoMinusculo.includes(
          "email not confirmed"
        ) ||
        textoMinusculo.includes(
          "email_not_confirmed"
        ) ||
        textoMinusculo.includes(
          "email not verified"
        )
      ) {

        texto =
        "Seu e-mail ainda não foi confirmado. " +
        "Abra o e-mail enviado pela Gold Style " +
        "e confirme sua conta antes de entrar.";

      }

      else if (
        textoMinusculo.includes(
          "invalid login credentials"
        )
      ) {

        texto =
        "E-mail ou senha incorretos. " +
        "Confira os dados e tente novamente.";

      }

      mensagem.innerHTML =
      "<span style='color:#ff4444;font-weight:bold'>" +

      "❌ Não foi possível entrar.<br><br>" +

      texto +

      "</span>";

      botao.disabled = false;

      botao.innerText =
      "ENTRAR";

    }

  }
);


esqueciSenha.addEventListener(
  "click",
  async function() {

    const email =
    document.getElementById("email").value.trim();

    if (!email) {

      mensagem.innerHTML =
      "<span style='color:#ffd700;font-weight:bold'>" +

      "Digite seu e-mail primeiro para " +
      "solicitar a recuperação da senha." +

      "</span>";

      document
      .getElementById("email")
      .focus();

      return;
    }

    mensagem.innerHTML =
    "<span style='color:#ffd700'>" +

    "Enviando solicitação de recuperação..." +

    "</span>";

    try {

      const { error } =
      await supabaseClient.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
          "https://wellysondrums21-boop.github.io/Gold_style/login.html"
        }
      );

      if (error) {
        throw error;
      }

      mensagem.innerHTML =
      "<span style='color:#ffd700;font-weight:bold'>" +

      "📩 Solicitação enviada!<br><br>" +

      "Se o e-mail estiver cadastrado, " +
      "você receberá as instruções " +
      "para redefinir sua senha." +

      "</span>";

    }

    catch (error) {

      console.error(
        "Erro ao recuperar senha:",
        error
      );

      mensagem.innerHTML =
      "<span style='color:#ff4444;font-weight:bold'>" +

      "❌ Não foi possível solicitar a recuperação." +
      "<br><br>" +

      (
        error?.message ||
        "Tente novamente."
      ) +

      "</span>";

    }

  }
);

</script>

</body>
  </html>
