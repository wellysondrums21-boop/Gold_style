<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar conta | Gold Style</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">GOLD STYLE</div>
  <div class="subtitle">CRIAR CONTA</div>
</header>

<main>

  <section class="hero">
    <h1>Crie sua conta</h1>

    <p>
      Cadastre seus dados para facilitar
      seus próximos agendamentos.
    </p>
  </section>

  <form>

    <label for="nome">Nome completo</label>

    <input
      type="text"
      id="nome"
      name="nome"
      placeholder="Digite seu nome completo"
      required>

    <label for="telefone">WhatsApp</label>

    <input
      type="tel"
      id="telefone"
      name="telefone"
      placeholder="(68) 99985-3643"
      required>

    <label for="email">E-mail</label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="seuemail@email.com"
      required>

    <label for="senha">Criar senha</label>

    <input
      type="password"
      id="senha"
      name="senha"
      placeholder="Crie uma senha"
      required>

    <label for="confirmar">Confirmar senha</label>

    <input
      type="password"
      id="confirmar"
      name="confirmar"
      placeholder="Digite a senha novamente"
      required>

    <button type="submit" class="btn btn-gold">
      CRIAR MINHA CONTA
    </button>

  </form>

  <a href="index.html" class="btn btn-dark">
    VOLTAR PARA INÍCIO
  </a>

</main>

<footer>
  <strong>Gold Style Barbearia</strong><br>
  Rio Branco - Acre<br>
  Barbearia desde 2022
</footer>

</body>
</html>
